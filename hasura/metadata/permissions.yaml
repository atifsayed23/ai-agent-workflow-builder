# Hasura Layer 1 Row-Level Security (RLS) Permissions
# Every permission explicitly verifies membership through org_members table.

permissions:
  organizations:
    select:
      - role: owner
        filter: { members: { user_id: { _eq: "X-Hasura-User-Id" } } }
      - role: editor
        filter: { members: { user_id: { _eq: "X-Hasura-User-Id" } } }
      - role: viewer
        filter: { members: { user_id: { _eq: "X-Hasura-User-Id" } } }

  org_members:
    select:
      - role: owner
        filter: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" } } } }
      - role: editor
        filter: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" } } } }
      - role: viewer
        filter: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" } } } }
    insert:
      - role: owner
        check: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" }, role: { _eq: "owner" } } } }

  workflows:
    select:
      - role: owner
        filter: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" } } } }
      - role: editor
        filter: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" } } } }
      - role: viewer
        filter: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" } } } }

    insert:
      - role: owner
        check: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" }, role: { _eq: "owner" } } } }
      - role: editor
        check: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" }, role: { _eq: "editor" } } } }

    update:
      - role: owner
        filter: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" }, role: { _eq: "owner" } } } }
      - role: editor
        filter: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" }, role: { _eq: "editor" } } } }

    delete:
      - role: owner
        filter: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" }, role: { _eq: "owner" } } } }

  workflow_steps:
    select:
      - role: owner
        filter: { workflow: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" } } } } }
      - role: editor
        filter: { workflow: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" } } } } }
      - role: viewer
        filter: { workflow: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" } } } } }

    insert:
      - role: owner
        check: { workflow: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" }, role: { _eq: "owner" } } } } }
      - role: editor
        check:
          _and:
            - { workflow: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" }, role: { _eq: "editor" } } } } }
            - { type: { _nin: ["db_write", "notify"] } } # Layer 2 Step Sandbox Guard

  workflow_triggers:
    select:
      - role: owner
        filter: { workflow: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" } } } } }
      - role: editor
        filter: { workflow: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" } } } } }
      - role: viewer
        filter: { workflow: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" } } } } }

    insert:
      - role: owner
        check: { workflow: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" }, role: { _eq: "owner" } } } } }

  workflow_runs:
    select:
      - role: owner
        filter: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" } } } }
      - role: editor
        filter: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" } } } }
      - role: viewer
        filter: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" } } } }

  step_runs:
    select:
      - role: owner
        filter: { workflow_run: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" } } } } }
      - role: editor
        filter: { workflow_run: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" } } } } }
      - role: viewer
        filter: { workflow_run: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" } } } } }

  db_write_records:
    select:
      - role: owner
        filter: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" } } } }
      - role: editor
        filter: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" } } } }
      - role: viewer
        filter: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" } } } }

  notifications_log:
    select:
      - role: owner
        filter: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" } } } }
      - role: editor
        filter: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" } } } }
      - role: viewer
        filter: { organization: { members: { user_id: { _eq: "X-Hasura-User-Id" } } } }
